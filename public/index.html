<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Fonts & Icons</title>
  
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/fill/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/thin/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/light/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/duotone/style.css">
  
  <!-- Prism.js for code highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap');
    
    /* ============================================
       DESIGN TOKENS
       ============================================ */
    :root {
      /* Monochrome Scale (80%) */
      --black: oklch(0% 0 0);
      --white: oklch(100% 0 0);
      --gray-950: oklch(12% 0 0);
      --gray-900: oklch(17% 0 0);
      --gray-800: oklch(24% 0 0);
      --gray-700: oklch(34% 0 0);
      --gray-600: oklch(44% 0 0);
      --gray-500: oklch(54% 0 0);
      --gray-400: oklch(64% 0 0);
      --gray-300: oklch(76% 0 0);
      --gray-200: oklch(86% 0 0);
      --gray-100: oklch(93% 0 0);
      --gray-50: oklch(97% 0 0);
      
      /* Primary Accent (20%) - Refined Indigo */
      --primary-600: oklch(45% 0.18 270);
      --primary-500: oklch(55% 0.20 270);
      --primary-400: oklch(65% 0.18 270);
      --primary-100: oklch(92% 0.04 270);
      --primary-50: oklch(96% 0.02 270);
      
      /* Status Colors */
      --success: oklch(65% 0.18 145);
      --warning: oklch(75% 0.15 85);
      --error: oklch(60% 0.20 25);
      
      /* Semantic Tokens - Light */
      --bg: var(--white);
      --bg-subtle: var(--gray-50);
      --bg-muted: var(--gray-100);
      --bg-elevated: var(--white);
      --bg-inverse: var(--gray-950);
      --fg: var(--gray-950);
      --fg-secondary: var(--gray-700);
      --fg-muted: var(--gray-500);
      --fg-subtle: var(--gray-400);
      --fg-inverse: var(--white);
      --border: var(--gray-200);
      --border-strong: var(--gray-300);
      --border-subtle: var(--gray-100);
      
      /* Primary mapped */
      --accent: var(--primary-500);
      --accent-hover: var(--primary-600);
      --accent-subtle: var(--primary-100);
      --accent-fg: var(--white);
      
      /* Typography */
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Outfit', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Spacing */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --space-20: 80px;
      
      /* Radii */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.04);
      --shadow-md: 0 4px 12px oklch(0% 0 0 / 0.06);
      --shadow-lg: 0 12px 32px oklch(0% 0 0 / 0.08);
      --shadow-xl: 0 24px 48px oklch(0% 0 0 / 0.12);
      
      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --duration-slow: 400ms;
    }
    
    [data-theme="dark"] {
      --bg: var(--gray-950);
      --bg-subtle: var(--gray-900);
      --bg-muted: var(--gray-800);
      --bg-elevated: var(--gray-900);
      --bg-inverse: var(--white);
      --fg: var(--gray-50);
      --fg-secondary: var(--gray-300);
      --fg-muted: var(--gray-400);
      --fg-subtle: var(--gray-600);
      --fg-inverse: var(--gray-950);
      --border: var(--gray-800);
      --border-strong: var(--gray-700);
      --border-subtle: var(--gray-900);
      
      --accent-subtle: oklch(25% 0.08 270);
      
      --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.2);
      --shadow-md: 0 4px 12px oklch(0% 0 0 / 0.3);
      --shadow-lg: 0 12px 32px oklch(0% 0 0 / 0.4);
      --shadow-xl: 0 24px 48px oklch(0% 0 0 / 0.5);
    }
    
    /* ============================================
       RESET & BASE
       ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }
    
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      overflow-x: hidden;
    }
    
    ::selection {
      background: var(--accent);
      color: var(--accent-fg);
    }
    
    button {
      font-family: inherit;
      cursor: pointer;
    }
    
    /* ============================================
       LAYOUT
       ============================================ */
    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    
    /* ============================================
       HEADER
       ============================================ */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: oklch(from var(--bg) l c h / 0.85);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 var(--space-4);
      max-width: 1600px;
      margin: 0 auto;
    }
    
    @media (min-width: 768px) {
      .header-inner {
        height: 64px;
        padding: 0 var(--space-8);
      }
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
      color: var(--fg);
    }
    
    .logo-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fg);
      border-radius: var(--radius-sm);
    }
    
    .logo-icon i {
      font-size: 1rem;
      color: var(--bg);
    }
    
    .logo-text {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-style: italic;
      letter-spacing: -0.02em;
      display: none;
    }
    
    @media (min-width: 480px) {
      .logo-text {
        display: block;
      }
    }
    
    .header-nav {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      background: var(--bg-muted);
      padding: var(--space-1);
      border-radius: var(--radius-full);
    }
    
    .nav-link {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--fg-muted);
      border-radius: var(--radius-full);
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .nav-link:hover {
      color: var(--fg);
    }
    
    .nav-link.active {
      color: var(--fg);
      background: var(--bg);
      box-shadow: var(--shadow-sm);
    }
    
    .nav-link i {
      font-size: 1rem;
    }
    
    .nav-link span {
      display: none;
    }
    
    @media (min-width: 480px) {
      .nav-link span {
        display: inline;
      }
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    
    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--fg-muted);
      transition: all var(--duration-fast) var(--ease-out);
      position: relative;
    }
    
    .icon-btn:hover {
      color: var(--fg);
      background: var(--bg-muted);
    }
    
    .icon-btn.active {
      color: var(--accent);
    }
    
    .icon-btn i {
      font-size: 1.25rem;
    }
    
    .icon-btn .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      border-radius: var(--radius-full);
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--accent-fg);
    }
    
    /* ============================================
       HERO
       ============================================ */
    .hero {
      padding: var(--space-10) var(--space-4) var(--space-8);
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }
    
    @media (min-width: 768px) {
      .hero {
        padding: var(--space-16) var(--space-8) var(--space-12);
      }
    }
    
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-3);
      margin-bottom: var(--space-4);
      background: var(--accent-subtle);
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: var(--space-6);
    }
    
    .hero-title em {
      font-style: italic;
      color: var(--accent);
    }
    
    .hero-meta {
      display: flex;
      gap: var(--space-8);
    }
    
    .hero-stat {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    
    .hero-stat-value {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
    }
    
    .hero-stat-label {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-subtle);
    }
    
    /* ============================================
       TOOLBAR
       ============================================ */
    .toolbar {
      position: sticky;
      top: 56px;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    
    @media (min-width: 768px) {
      .toolbar {
        top: 64px;
      }
    }
    
    .toolbar-inner {
      display: flex;
      gap: var(--space-3);
      align-items: center;
      padding: var(--space-3) var(--space-4);
      max-width: 1600px;
      margin: 0 auto;
    }
    
    @media (min-width: 768px) {
      .toolbar-inner {
        padding: var(--space-4) var(--space-8);
      }
    }
    
    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    
    .search-box i {
      position: absolute;
      left: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.125rem;
      color: var(--fg-subtle);
      pointer-events: none;
    }
    
    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 var(--space-4) 0 var(--space-10);
      background: var(--bg-subtle);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--fg);
      outline: none;
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .search-input::placeholder {
      color: var(--fg-subtle);
    }
    
    .search-input:focus {
      background: var(--bg);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    
    .filter-scroll {
      display: flex;
      gap: var(--space-1);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: var(--space-1) 0;
    }
    
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }
    
    .filter-chip {
      flex-shrink: 0;
      height: 32px;
      padding: 0 var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-1);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-muted);
      white-space: nowrap;
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .filter-chip:hover {
      border-color: var(--fg-muted);
      color: var(--fg);
    }
    
    .filter-chip.active {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }
    
    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
      display: none;
    }
    
    @media (min-width: 640px) {
      .toolbar-divider {
        display: block;
      }
    }
    
    .view-toggle {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-muted);
      padding: 2px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }
    
    .view-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--fg-muted);
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .view-btn:hover {
      color: var(--fg);
    }
    
    .view-btn.active {
      background: var(--bg);
      color: var(--fg);
      box-shadow: var(--shadow-sm);
    }
    
    .view-btn i {
      font-size: 1.125rem;
    }
    
    .result-count {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-subtle);
      display: none;
    }
    
    @media (min-width: 768px) {
      .result-count {
        display: block;
      }
    }
    
    /* ============================================
       PANELS
       ============================================ */
    .panel {
      display: none;
    }
    
    .panel.active {
      display: block;
    }
    
    .content {
      padding: var(--space-6) var(--space-4) var(--space-20);
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }
    
    @media (min-width: 768px) {
      .content {
        padding: var(--space-8) var(--space-8) var(--space-20);
      }
    }
    
    /* ============================================
       FONT LIST VIEW
       ============================================ */
    .font-list {
      display: flex;
      flex-direction: column;
    }
    
    .font-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-4);
      padding: var(--space-5) 0;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
    }
    
    @media (min-width: 768px) {
      .font-item {
        grid-template-columns: 200px 1fr auto;
        gap: var(--space-8);
        padding: var(--space-6) 0;
      }
    }
    
    .font-item:hover {
      padding-left: var(--space-4);
      background: var(--bg-subtle);
      margin: 0 calc(var(--space-4) * -1);
      padding-right: var(--space-4);
      border-radius: var(--radius-md);
    }
    
    @media (min-width: 768px) {
      .font-item:hover {
        margin: 0 calc(var(--space-8) * -1);
        padding-left: var(--space-8);
        padding-right: var(--space-8);
      }
    }
    
    .font-info {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      min-width: 0;
    }
    
    .font-name {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    
    .font-meta {
      display: flex;
      gap: var(--space-3);
      font-family: var(--font-mono);
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-subtle);
    }
    
    .font-preview {
      font-size: clamp(1.75rem, 5vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }
    
    @media (min-width: 768px) {
      .font-preview {
        display: block;
      }
    }
    
    .font-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    
    .font-action-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--fg-subtle);
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .font-action-btn:hover {
      color: var(--fg);
      background: var(--bg-muted);
    }
    
    .font-action-btn.favorited {
      color: var(--accent);
    }
    
    .font-action-btn.favorited:hover {
      background: var(--accent-subtle);
    }
    
    .font-action-btn i {
      font-size: 1.125rem;
    }
    
    /* ============================================
       FONT GRID VIEW
       ============================================ */
    .font-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    
    .font-card {
      display: flex;
      flex-direction: column;
      padding: var(--space-5);
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-out);
    }
    
    .font-card:hover {
      background: var(--bg);
      border-color: var(--border);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    
    .font-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }
    
    .font-card-preview {
      font-size: 2rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-4);
      height: 72px;
      overflow: hidden;
    }
    
    .font-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
    }
    
    .font-card-category {
      display: inline-flex;
      padding: var(--space-1) var(--space-2);
      background: var(--bg-muted);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
    }
    
    .font-card-weights {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--fg-subtle);
    }
    
    /* ============================================
       ICON GRID
       ============================================ */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 1px;
      background: var(--border-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    
    @media (min-width: 640px) {
      .icon-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }
    
    .icon-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--bg);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
      position: relative;
    }
    
    .icon-cell:hover {
      background: var(--accent);
      z-index: 1;
    }
    
    .icon-cell img,
    .icon-cell i {
      font-size: 1.75rem;
      width: 28px;
      height: 28px;
      color: var(--fg);
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    [data-theme="dark"] .icon-cell img {
      filter: invert(1);
    }
    
    .icon-cell:hover img,
    .icon-cell:hover i {
      color: var(--accent-fg);
      transform: scale(1.15);
    }
    
    [data-theme="dark"] .icon-cell:hover img {
      filter: invert(0);
    }
    
    .icon-cell-name {
      font-family: var(--font-mono);
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--fg-subtle);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .icon-cell:hover .icon-cell-name {
      color: var(--accent-fg);
      opacity: 0.8;
    }
    
    .icon-cell .fav-indicator {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: var(--radius-full);
      opacity: 0;
      transition: opacity var(--duration-fast) var(--ease-out);
    }
    
    .icon-cell.favorited .fav-indicator {
      opacity: 1;
    }
    
    .icon-cell:hover .fav-indicator {
      background: var(--accent-fg);
    }
    
    /* ============================================
       ICON LIST VIEW
       ============================================ */
    .icon-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    
    .icon-list-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: var(--space-4);
      align-items: center;
      padding: var(--space-3) var(--space-4);
      background: var(--bg);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .icon-list-item:hover {
      background: var(--bg-subtle);
    }
    
    .icon-list-preview {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-muted);
      border-radius: var(--radius-md);
    }
    
    .icon-list-preview img,
    .icon-list-preview i {
      font-size: 1.5rem;
      width: 24px;
      height: 24px;
      color: var(--fg);
    }
    
    [data-theme="dark"] .icon-list-preview img {
      filter: invert(1);
    }
    
    .icon-list-info {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      min-width: 0;
    }
    
    .icon-list-name {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    
    .icon-list-tags {
      font-size: 0.75rem;
      color: var(--fg-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .icon-list-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    
    /* ============================================
       MODAL
       ============================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: oklch(0% 0 0 / 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all var(--duration-normal) var(--ease-out);
    }
    
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 92vh;
      max-height: 92dvh;
      background: var(--bg);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      z-index: 1001;
      transform: translateY(100%);
      transition: transform var(--duration-slow) var(--ease-out);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    @media (min-width: 768px) {
      .modal-sheet {
        top: 50%;
        left: 50%;
        bottom: auto;
        right: auto;
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 0;
        width: 90%;
        max-width: 600px;
        max-height: 85vh;
        max-height: 85dvh;
        border-radius: var(--radius-xl);
      }
    }
    
    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }
    
    @media (min-width: 768px) {
      .modal-backdrop.open .modal-sheet {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }
    
    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border-strong);
      border-radius: 2px;
      margin: var(--space-2) auto;
      flex-shrink: 0;
    }
    
    @media (min-width: 768px) {
      .modal-handle {
        display: none;
      }
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    
    .modal-title {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    
    .modal-header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    
    .modal-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-muted);
      border: none;
      border-radius: var(--radius-md);
      color: var(--fg-muted);
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .modal-close:hover {
      background: var(--border);
      color: var(--fg);
    }
    
    .modal-body {
      padding: var(--space-6) var(--space-5);
      overflow-y: auto;
      flex: 1;
    }
    
    /* Font Modal */
    .font-modal-preview {
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-6);
      min-height: 100px;
      padding: var(--space-5);
      background: var(--bg-subtle);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
    }
    
    .font-modal-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.9375rem;
      color: var(--fg);
      outline: none;
      margin-bottom: var(--space-8);
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .font-modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    
    .modal-section {
      margin-bottom: var(--space-8);
    }
    
    .modal-section:last-child {
      margin-bottom: 0;
    }
    
    .modal-label {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--fg-subtle);
      margin-bottom: var(--space-3);
    }
    
    /* Multi-variant Preview */
    .variant-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }
    
    .variant-preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-4);
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .variant-preview-item:hover {
      background: var(--bg-muted);
      border-color: var(--border);
    }

    .variant-preview-item.active {
      background: var(--bg);
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .variant-preview-item.active .variant-preview-label {
      color: var(--accent);
      font-weight: 600;
    }
    
    .variant-preview-text {
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    
    .variant-preview-label {
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-subtle);
    }
    
    .variant-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    
    .variant-tag {
      padding: var(--space-1) var(--space-3);
      background: var(--bg-muted);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--fg-muted);
    }
    
    /* Code Block with Prism */
    .code-block {
      background: var(--gray-950);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    
    [data-theme="dark"] .code-block {
      background: var(--gray-900);
      border: 1px solid var(--border);
    }
    
    .code-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid oklch(100% 0 0 / 0.1);
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .code-tabs::-webkit-scrollbar {
      display: none;
    }
    
    .code-tab {
      flex-shrink: 0;
      padding: var(--space-3) var(--space-4);
      background: transparent;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: oklch(100% 0 0 / 0.5);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .code-tab:hover {
      color: oklch(100% 0 0 / 0.7);
    }
    
    .code-tab.active {
      color: var(--white);
      background: oklch(100% 0 0 / 0.05);
    }
    
    .code-body {
      position: relative;
      padding: var(--space-4);
    }
    
    .code-block pre[class*="language-"] {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.6;
    }
    
    .code-block code[class*="language-"] {
      font-family: var(--font-mono);
    }
    
    .code-copy {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      padding: var(--space-1) var(--space-3);
      background: oklch(100% 0 0 / 0.1);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: oklch(100% 0 0 / 0.7);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }
    
    .code-copy:hover {
      background: oklch(100% 0 0 / 0.15);
      color: var(--white);
    }
    
    .code-copy.copied {
      background: var(--success);
      color: var(--white);
    }
    
    /* Icon Modal */
    .icon-modal-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
      padding: var(--space-8) var(--space-4);
      margin-bottom: var(--space-6);
      background: var(--bg-subtle);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
    }
    
    .icon-variant-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2);
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--duration-fast) var(--ease-out);
    }

    .icon-variant-preview:hover {
      background: var(--bg-muted);
    }

    .icon-variant-preview.active {
      background: var(--bg);
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }
    
    .icon-variant-preview.active span {
      color: var(--accent);
      font-weight: 600;
    }
    
    .icon-variant-preview img,
    .icon-variant-preview i {
      font-size: 2.5rem;
      width: 40px;
      height: 40px;
      color: var(--fg);
    }
    
    [data-theme="dark"] .icon-variant-preview img {
      filter: invert(1);
    }
    
    .icon-variant-preview span {
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-subtle);
    }
    
    /* ============================================
       EMPTY STATE
       ============================================ */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-20) var(--space-6);
      text-align: center;
    }
    
    .empty-icon {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-6);
      background: var(--bg-muted);
      border-radius: var(--radius-lg);
    }
    
    .empty-icon i {
      font-size: 1.5rem;
      color: var(--fg-subtle);
    }
    
    .empty-title {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: var(--space-2);
    }
    
    .empty-text {
      font-size: 0.875rem;
      color: var(--fg-muted);
      max-width: 280px;
    }
    
    /* ============================================
       LOADING
       ============================================ */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-20) var(--space-6);
      gap: var(--space-4);
    }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-subtle);
    }
    
    /* ============================================
       TOAST
       ============================================ */
    .toast-container {
      position: fixed;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      pointer-events: none;
    }
    
    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--fg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 0.875rem;
      color: var(--bg);
      pointer-events: auto;
      animation: toastIn 0.3s var(--ease-out);
    }
    
    .toast.out {
      animation: toastOut 0.2s var(--ease-out) forwards;
    }
    
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
      }
    }
    
    .toast i {
      font-size: 1.125rem;
    }
    
    /* ============================================
       SCROLLBAR
       ============================================ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }
    
    /* ============================================
       UTILITIES
       ============================================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <a href="#" class="logo">
          <div class="logo-icon">
            <i class="ph-bold ph-stack"></i>
          </div>
          <span class="logo-text">Library</span>
        </a>
        
        <nav class="header-nav">
          <a href="#" class="nav-link active" data-panel="fonts">
            <i class="ph-bold ph-text-aa"></i>
            <span>Fonts</span>
          </a>
          <a href="#" class="nav-link" data-panel="icons">
            <i class="ph-bold ph-shapes"></i>
            <span>Icons</span>
          </a>
        </nav>
        
        <div class="header-actions">
          <button class="icon-btn" id="favoritesBtn" aria-label="View favorites">
            <i class="ph ph-heart"></i>
            <span class="badge" id="favCount" style="display: none;">0</span>
          </button>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
            <i class="ph ph-moon"></i>
          </button>
        </div>
      </div>
    </header>
    
    <!-- Fonts Panel -->
    <div id="fonts-panel" class="panel active">
      <section class="hero">
        <div class="hero-eyebrow">
          <i class="ph-bold ph-sparkle"></i>
          Design Resources
        </div>
        <h1 class="hero-title"><em>Type</em>faces</h1>
        <div class="hero-meta">
          <div class="hero-stat">
            <span class="hero-stat-value" id="fontTotal">—</span>
            <span class="hero-stat-label">Families</span>
          </div>
          <div class="hero-stat">
            <span class="hero-stat-value" id="variantTotal">—</span>
            <span class="hero-stat-label">Weights</span>
          </div>
        </div>
      </section>
      
      <div class="toolbar">
        <div class="toolbar-inner">
          <div class="search-box">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" class="search-input" id="fontSearch" placeholder="Search fonts...">
          </div>
          
          <div class="filter-scroll" id="fontFilters">
            <button class="filter-chip active" data-filter="">All</button>
            <button class="filter-chip" data-filter="sans-serif">Sans</button>
            <button class="filter-chip" data-filter="serif">Serif</button>
            <button class="filter-chip" data-filter="monospace">Mono</button>
            <button class="filter-chip" data-filter="display">Display</button>
            <button class="filter-chip" data-filter="favorites">
              <i class="ph ph-heart"></i> Favorites
            </button>
          </div>
          
          <div class="toolbar-divider"></div>
          
          <div class="view-toggle" id="fontViewToggle">
            <button class="view-btn active" data-view="list" aria-label="List view">
              <i class="ph ph-list"></i>
            </button>
            <button class="view-btn" data-view="grid" aria-label="Grid view">
              <i class="ph ph-grid-four"></i>
            </button>
          </div>
          
          <span class="result-count" id="fontCount">0 results</span>
        </div>
      </div>
      
      <div class="content">
        <div id="fontContainer">
          <div class="loading">
            <div class="spinner"></div>
            <span class="loading-text">Loading fonts</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Icons Panel -->
    <div id="icons-panel" class="panel">
      <section class="hero">
        <div class="hero-eyebrow">
          <i class="ph-bold ph-sparkle"></i>
          Design Resources
        </div>
        <h1 class="hero-title"><em>Icon</em>ography</h1>
        <div class="hero-meta">
          <div class="hero-stat">
            <span class="hero-stat-value" id="iconTotal">—</span>
            <span class="hero-stat-label">Icons</span>
          </div>
          <div class="hero-stat">
            <span class="hero-stat-value">6</span>
            <span class="hero-stat-label">Weights</span>
          </div>
        </div>
      </section>
      
      <div class="toolbar">
        <div class="toolbar-inner">
          <div class="search-box">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" class="search-input" id="iconSearch" placeholder="Search icons...">
          </div>
          
          <div class="filter-scroll" id="iconFilters">
            <button class="filter-chip active" data-variant="regular">Regular</button>
            <button class="filter-chip" data-variant="bold">Bold</button>
            <button class="filter-chip" data-variant="fill">Fill</button>
            <button class="filter-chip" data-variant="thin">Thin</button>
            <button class="filter-chip" data-variant="light">Light</button>
            <button class="filter-chip" data-variant="duotone">Duotone</button>
            <button class="filter-chip" data-filter="favorites">
              <i class="ph ph-heart"></i> Favorites
            </button>
          </div>
          
          <div class="toolbar-divider"></div>
          
          <div class="view-toggle" id="iconViewToggle">
            <button class="view-btn active" data-view="grid" aria-label="Grid view">
              <i class="ph ph-grid-four"></i>
            </button>
            <button class="view-btn" data-view="list" aria-label="List view">
              <i class="ph ph-list"></i>
            </button>
          </div>
          
          <span class="result-count" id="iconCount">0 results</span>
        </div>
      </div>
      
      <div class="content">
        <div id="iconContainer">
          <div class="loading">
            <div class="spinner"></div>
            <span class="loading-text">Loading icons</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Font Modal -->
  <div class="modal-backdrop" id="fontModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="fontModalTitle">Font Name</h2>
        <div class="modal-header-actions">
          <button class="icon-btn" id="fontModalFavBtn" aria-label="Add to favorites">
            <i class="ph ph-heart"></i>
          </button>
          <button class="modal-close" onclick="closeFontModal()">
            <i class="ph ph-x"></i>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div class="font-modal-preview" id="fontModalPreview">Aa Bb Cc</div>
        <input type="text" class="font-modal-input" id="fontPreviewInput" value="The quick brown fox jumps over the lazy dog" placeholder="Type to preview...">
        
        <div class="modal-section">
          <div class="modal-label">Weight Preview</div>
          <div class="variant-preview-grid" id="fontVariantPreview"></div>
        </div>
        
        <div class="modal-section">
          <div class="modal-label">Available Weights</div>
          <div class="variant-list" id="fontModalVariants"></div>
        </div>
        
        <div class="modal-section">
          <div class="modal-label">Usage</div>
          <div class="code-block">
            <div class="code-tabs">
              <button class="code-tab active" data-code="css">CSS</button>
              <button class="code-tab" data-code="html">HTML</button>
              <button class="code-tab" data-code="url">URL</button>
            </div>
            <div class="code-body">
              <button class="code-copy" onclick="copyCode(this)">Copy</button>
              <pre id="fontModalCode"><code class="language-css"></code></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Icon Modal -->
  <div class="modal-backdrop" id="iconModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="iconModalTitle">Icon Name</h2>
        <div class="modal-header-actions">
          <button class="icon-btn" id="iconModalFavBtn" aria-label="Add to favorites">
            <i class="ph ph-heart"></i>
          </button>
          <button class="modal-close" onclick="closeIconModal()">
            <i class="ph ph-x"></i>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div class="icon-modal-preview" id="iconModalPreview"></div>
        
        <div class="modal-section">
          <div class="modal-label">Usage</div>
          <div class="code-block">
            <div class="code-tabs">
              <button class="code-tab active" data-code="html">HTML</button>
              <button class="code-tab" data-code="react">React</button>
              <button class="code-tab" data-code="svg">SVG URL</button>
            </div>
            <div class="code-body">
              <button class="code-copy" onclick="copyCode(this)">Copy</button>
              <pre id="iconModalCode"><code class="language-markup"></code></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ========================================
    // STATE
    // ========================================
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3005/api/v1'
      : '/api/v1';
    
    let allFonts = [];
    let allIcons = [];
    let currentFont = null;
    let currentIcon = null;
    let fontFilter = '';
    let iconVariant = 'regular';
    let currentIconVariant = 'regular';
    let currentFontWeight = '400';
    let fontView = 'list';
    let iconView = 'grid';
    let showFontFavorites = false;
    let showIconFavorites = false;
    let fontCodeTab = 'css';
    let iconCodeTab = 'html';
    
    // Favorites stored in localStorage
    const FAVORITES_KEY = 'library_favorites';
    let favorites = {
      fonts: [],
      icons: []
    };
    
    // ========================================
    // FAVORITES
    // ========================================
    function loadFavorites() {
      try {
        const stored = localStorage.getItem(FAVORITES_KEY);
        if (stored) {
          favorites = JSON.parse(stored);
        }
      } catch (e) {
        console.error('Failed to load favorites:', e);
      }
      updateFavoritesCount();
    }
    
    function saveFavorites() {
      try {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      } catch (e) {
        console.error('Failed to save favorites:', e);
      }
      updateFavoritesCount();
    }
    
    function updateFavoritesCount() {
      const total = favorites.fonts.length + favorites.icons.length;
      const badge = document.getElementById('favCount');
      const btn = document.getElementById('favoritesBtn');
      
      if (total > 0) {
        badge.textContent = total;
        badge.style.display = 'flex';
        btn.classList.add('active');
      } else {
        badge.style.display = 'none';
        btn.classList.remove('active');
      }
    }
    
    function toggleFontFavorite(fontFamily, e) {
      if (e) e.stopPropagation();
      
      const idx = favorites.fonts.indexOf(fontFamily);
      if (idx > -1) {
        favorites.fonts.splice(idx, 1);
        showToast('Removed from favorites', 'ph-heart-break');
      } else {
        favorites.fonts.push(fontFamily);
        showToast('Added to favorites', 'ph-heart-fill');
      }
      saveFavorites();
      renderFonts();
      updateFontModalFavBtn();
    }
    
    function toggleIconFavorite(iconName, e) {
      if (e) e.stopPropagation();
      
      const idx = favorites.icons.indexOf(iconName);
      if (idx > -1) {
        favorites.icons.splice(idx, 1);
        showToast('Removed from favorites', 'ph-heart-break');
      } else {
        favorites.icons.push(iconName);
        showToast('Added to favorites', 'ph-heart-fill');
      }
      saveFavorites();
      renderIcons();
      updateIconModalFavBtn();
    }
    
    function isFontFavorite(fontFamily) {
      return favorites.fonts.includes(fontFamily);
    }
    
    function isIconFavorite(iconName) {
      return favorites.icons.includes(iconName);
    }
    
    // ========================================
    // TOAST
    // ========================================
    function showToast(message, icon = 'ph-check') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i class="ph ${icon}"></i><span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('out');
        setTimeout(() => toast.remove(), 200);
      }, 2000);
    }
    
    // ========================================
    // THEME
    // ========================================
    const themeBtn = document.getElementById('themeBtn');
    let theme = localStorage.getItem('theme') || 'light';
    
    function setTheme(t) {
      theme = t;
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
      themeBtn.querySelector('i').className = t === 'dark' ? 'ph ph-sun' : 'ph ph-moon';
    }
    
    themeBtn.onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');
    setTheme(theme);
    
    // ========================================
    // NAVIGATION
    // ========================================
    document.querySelectorAll('.nav-link').forEach(link => {
      link.onclick = (e) => {
        e.preventDefault();
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`${link.dataset.panel}-panel`).classList.add('active');
      };
    });
    
    // Favorites button in header
    document.getElementById('favoritesBtn').onclick = () => {
      // Toggle favorites view for current panel
      const activePanel = document.querySelector('.panel.active');
      if (activePanel.id === 'fonts-panel') {
        showFontFavorites = !showFontFavorites;
        const chip = document.querySelector('#fontFilters [data-filter="favorites"]');
        if (showFontFavorites) {
          document.querySelectorAll('#fontFilters .filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          fontFilter = '';
        } else {
          chip.classList.remove('active');
          document.querySelector('#fontFilters [data-filter=""]').classList.add('active');
        }
        renderFonts();
      } else {
        showIconFavorites = !showIconFavorites;
        const chip = document.querySelector('#iconFilters [data-filter="favorites"]');
        if (showIconFavorites) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
        renderIcons();
      }
    };
    
    // ========================================
    // LOAD DATA
    // ========================================
    async function loadFonts() {
      try {
        const res = await fetch(`${API_BASE}/fonts`);
        if (res.ok) {
          const data = await res.json();
          allFonts = data.items || [];
        } else throw new Error();
      } catch {
        try {
          const res = await fetch('../data/fonts-api-db.json');
          const data = await res.json();
          allFonts = data.fonts ? Object.values(data.fonts) : [];
        } catch {
          allFonts = getMockFonts();
        }
      }
      
      const totalVariants = allFonts.reduce((sum, f) => sum + (f.variants?.length || 0), 0);
      document.getElementById('fontTotal').textContent = allFonts.length;
      document.getElementById('variantTotal').textContent = totalVariants;
      renderFonts();
    }
    
    async function loadIcons() {
      try {
        const res = await fetch(`${API_BASE}/icons?limit=2000`);
        if (res.ok) {
          const data = await res.json();
          allIcons = data.items || [];
        } else throw new Error();
      } catch {
        try {
          const res = await fetch('../data/icons-api-db.json');
          const data = await res.json();
          allIcons = Object.values(data.providers?.phosphor?.icons || {});
        } catch {
          allIcons = getMockIcons();
        }
      }
      
      document.getElementById('iconTotal').textContent = allIcons.length;
      renderIcons();
    }
    
    // ========================================
    // RENDER FONTS
    // ========================================
    function renderFonts() {
      const search = document.getElementById('fontSearch').value.toLowerCase();
      
      let filtered = allFonts.filter(f => {
        const matchSearch = (f.family || '').toLowerCase().includes(search) ||
                           (f.displayName || '').toLowerCase().includes(search);
        const matchFilter = !fontFilter || f.category === fontFilter;
        const matchFavorites = !showFontFavorites || isFontFavorite(f.family);
        return matchSearch && matchFilter && matchFavorites;
      }).sort((a, b) => (a.family || '').localeCompare(b.family || ''));
      
      document.getElementById('fontCount').textContent = `${filtered.length} results`;
      
      const container = document.getElementById('fontContainer');
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon"><i class="ph ph-magnifying-glass"></i></div>
            <h3 class="empty-title">${showFontFavorites ? 'No favorites yet' : 'No fonts found'}</h3>
            <p class="empty-text">${showFontFavorites ? 'Click the heart icon on any font to add it to your favorites' : 'Try a different search term or filter'}</p>
          </div>
        `;
        return;
      }
      
      filtered.forEach(f => injectFont(f));
      
      if (fontView === 'list') {
        container.innerHTML = `<div class="font-list">${filtered.map(f => renderFontListItem(f)).join('')}</div>`;
      } else {
        container.innerHTML = `<div class="font-grid">${filtered.map(f => renderFontGridItem(f)).join('')}</div>`;
      }
    }
    
    function renderFontListItem(f) {
      const isFav = isFontFavorite(f.family);
      return `
        <article class="font-item" onclick='openFontModal(${JSON.stringify(f).replace(/'/g, "&#39;")})'>
          <div class="font-info">
            <h3 class="font-name">${f.displayName || f.family}</h3>
            <div class="font-meta">
              <span>${f.category || 'sans-serif'}</span>
              <span>${f.variants?.length || 0} weights</span>
            </div>
          </div>
          <div class="font-preview" style="font-family: '${f.family}', sans-serif;">
            The quick brown fox
          </div>
          <div class="font-actions">
            <button class="font-action-btn ${isFav ? 'favorited' : ''}" onclick="toggleFontFavorite('${f.family}', event)" aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
              <i class="ph ${isFav ? 'ph-heart-fill' : 'ph-heart'}"></i>
            </button>
            <button class="font-action-btn">
              <i class="ph ph-arrow-right"></i>
            </button>
          </div>
        </article>
      `;
    }
    
    function renderFontGridItem(f) {
      const isFav = isFontFavorite(f.family);
      return `
        <article class="font-card" onclick='openFontModal(${JSON.stringify(f).replace(/'/g, "&#39;")})'>
          <div class="font-card-header">
            <div class="font-info">
              <h3 class="font-name">${f.displayName || f.family}</h3>
            </div>
            <button class="font-action-btn ${isFav ? 'favorited' : ''}" onclick="toggleFontFavorite('${f.family}', event)" aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
              <i class="ph ${isFav ? 'ph-heart-fill' : 'ph-heart'}"></i>
            </button>
          </div>
          <div class="font-card-preview" style="font-family: '${f.family}', sans-serif;">
            Aa Bb Cc Dd Ee
          </div>
          <div class="font-card-footer">
            <span class="font-card-category">${f.category || 'sans-serif'}</span>
            <span class="font-card-weights">${f.variants?.length || 0} weights</span>
          </div>
        </article>
      `;
    }
    
    // ========================================
    // RENDER ICONS
    // ========================================
    function renderIcons() {
      const search = document.getElementById('iconSearch').value.toLowerCase();
      
      let filtered = allIcons.filter(i => {
        const matchSearch = (i.name || '').toLowerCase().includes(search) ||
               (i.displayName || '').toLowerCase().includes(search) ||
               (i.tags || []).some(t => t.toLowerCase().includes(search));
        const matchFavorites = !showIconFavorites || isIconFavorite(i.name);
        return matchSearch && matchFavorites;
      }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      
      document.getElementById('iconCount').textContent = `${filtered.length} results`;
      
      const container = document.getElementById('iconContainer');
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon"><i class="ph ph-magnifying-glass"></i></div>
            <h3 class="empty-title">${showIconFavorites ? 'No favorites yet' : 'No icons found'}</h3>
            <p class="empty-text">${showIconFavorites ? 'Click the heart icon on any icon to add it to your favorites' : 'Try a different search term'}</p>
          </div>
        `;
        return;
      }
      
      const baseUrl = API_BASE.replace('/api/v1', '');
      
      if (iconView === 'grid') {
        container.innerHTML = `<div class="icon-grid">${filtered.map(i => renderIconGridItem(i, baseUrl)).join('')}</div>`;
      } else {
        container.innerHTML = `<div class="icon-list">${filtered.map(i => renderIconListItem(i, baseUrl)).join('')}</div>`;
      }
    }
    
    function renderIconGridItem(i, baseUrl) {
      const isFav = isIconFavorite(i.name);
      const filename = iconVariant === 'regular' ? `${i.name}.svg` : `${i.name}-${iconVariant}.svg`;
      const url = `${baseUrl}/icons/phosphor/svg/${iconVariant}/${filename}`;
      return `
        <article class="icon-cell ${isFav ? 'favorited' : ''}" onclick='openIconModal(${JSON.stringify(i).replace(/'/g, "&#39;")})'>
          <div class="fav-indicator"></div>
          <img src="${url}" alt="${i.displayName || i.name}" loading="lazy">
          <span class="icon-cell-name">${i.name}</span>
        </article>
      `;
    }
    
    function renderIconListItem(i, baseUrl) {
      const isFav = isIconFavorite(i.name);
      const filename = iconVariant === 'regular' ? `${i.name}.svg` : `${i.name}-${iconVariant}.svg`;
      const url = `${baseUrl}/icons/phosphor/svg/${iconVariant}/${filename}`;
      return `
        <article class="icon-list-item" onclick='openIconModal(${JSON.stringify(i).replace(/'/g, "&#39;")})'>
          <div class="icon-list-preview">
            <img src="${url}" alt="${i.displayName || i.name}" loading="lazy">
          </div>
          <div class="icon-list-info">
            <h3 class="icon-list-name">${i.displayName || i.name}</h3>
            <p class="icon-list-tags">${(i.tags || []).slice(0, 5).join(', ')}</p>
          </div>
          <div class="icon-list-actions">
            <button class="font-action-btn ${isFav ? 'favorited' : ''}" onclick="toggleIconFavorite('${i.name}', event)" aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
              <i class="ph ${isFav ? 'ph-heart-fill' : 'ph-heart'}"></i>
            </button>
            <button class="font-action-btn">
              <i class="ph ph-arrow-right"></i>
            </button>
          </div>
        </article>
      `;
    }
    
    // ========================================
    // FILTERS
    // ========================================
    document.querySelectorAll('#fontFilters .filter-chip').forEach(chip => {
      chip.onclick = () => {
        if (chip.dataset.filter === 'favorites') {
          showFontFavorites = !showFontFavorites;
          if (showFontFavorites) {
            document.querySelectorAll('#fontFilters .filter-chip:not([data-filter="favorites"])').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            fontFilter = '';
          } else {
            chip.classList.remove('active');
            document.querySelector('#fontFilters [data-filter=""]').classList.add('active');
          }
        } else {
          showFontFavorites = false;
          document.querySelectorAll('#fontFilters .filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          fontFilter = chip.dataset.filter;
        }
        renderFonts();
      };
    });
    
    document.querySelectorAll('#iconFilters .filter-chip').forEach(chip => {
      chip.onclick = () => {
        if (chip.dataset.filter === 'favorites') {
          showIconFavorites = !showIconFavorites;
          chip.classList.toggle('active', showIconFavorites);
        } else if (chip.dataset.variant) {
          document.querySelectorAll('#iconFilters [data-variant]').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          iconVariant = chip.dataset.variant;
        }
        renderIcons();
      };
    });
    
    // ========================================
    // VIEW TOGGLE
    // ========================================
    document.querySelectorAll('#fontViewToggle .view-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#fontViewToggle .view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        fontView = btn.dataset.view;
        renderFonts();
      };
    });
    
    document.querySelectorAll('#iconViewToggle .view-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#iconViewToggle .view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        iconView = btn.dataset.view;
        renderIcons();
      };
    });
    
    // ========================================
    // SEARCH
    // ========================================
    document.getElementById('fontSearch').oninput = renderFonts;
    document.getElementById('iconSearch').oninput = renderIcons;
    
    // ========================================
    // FONT MODAL
    // ========================================
    function openFontModal(font) {
      currentFont = font;
      fontCodeTab = 'css';
      
      const weights = (font.variants || ['400']);
      currentFontWeight = weights.includes('400') ? '400' : weights[0];
      
      const modal = document.getElementById('fontModal');
      document.getElementById('fontModalTitle').textContent = font.displayName || font.family;
      
      const preview = document.getElementById('fontModalPreview');
      preview.style.fontFamily = `'${font.family}', sans-serif`;
      preview.style.fontWeight = parseInt(currentFontWeight) || 400;
      preview.style.fontStyle = currentFontWeight.includes('italic') ? 'italic' : 'normal';
      preview.textContent = document.getElementById('fontPreviewInput').value || 'The quick brown fox jumps over the lazy dog';
      
      // Multi-variant preview
      const variantPreview = document.getElementById('fontVariantPreview');
      const displayWeights = weights.slice(0, 6);
      
      variantPreview.innerHTML = displayWeights.map(w => {
        const weightNum = parseInt(w) || 400;
        const style = w.includes('italic') ? 'italic' : 'normal';
        const isActive = w === currentFontWeight ? 'active' : '';
        
        return `
          <div class="variant-preview-item ${isActive}" onclick="selectFontWeight('${w}')" data-weight="${w}">
            <span class="variant-preview-text" style="font-family: '${font.family}', sans-serif; font-weight: ${weightNum}; font-style: ${style};">Aa</span>
            <span class="variant-preview-label">${w}</span>
          </div>
        `;
      }).join('');
      
      document.getElementById('fontModalVariants').innerHTML = (font.variants || [])
        .map(v => `<span class="variant-tag">${v}</span>`).join('');
      
      updateFontCode();
      updateFontModalFavBtn();
      
      // Reset code tabs
      modal.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
      modal.querySelector('.code-tab').classList.add('active');
      
      modal.classList.add('open');
    }
    
    function selectFontWeight(weight) {
      currentFontWeight = weight;
      
      // Update UI
      const container = document.getElementById('fontVariantPreview');
      container.querySelectorAll('.variant-preview-item').forEach(el => {
        el.classList.toggle('active', el.dataset.weight === weight);
      });
      
      // Update Preview
      const preview = document.getElementById('fontModalPreview');
      const weightNum = parseInt(weight) || 400;
      preview.style.fontWeight = weightNum;
      preview.style.fontStyle = weight.includes('italic') ? 'italic' : 'normal';
    }
    
    function closeFontModal() {
      document.getElementById('fontModal').classList.remove('open');
    }
    
    function updateFontModalFavBtn() {
      if (!currentFont) return;
      const btn = document.getElementById('fontModalFavBtn');
      const isFav = isFontFavorite(currentFont.family);
      btn.innerHTML = `<i class="ph ${isFav ? 'ph-heart-fill' : 'ph-heart'}"></i>`;
      btn.classList.toggle('active', isFav);
    }
    
    document.getElementById('fontModalFavBtn').onclick = () => {
      if (currentFont) {
        toggleFontFavorite(currentFont.family);
      }
    };
    
    function updateFontCode() {
      if (!currentFont) return;
      const family = currentFont.family;
      const weights = (currentFont.variants || ['400']).join(';');
      const base = window.location.origin;
      
      const codes = {
        css: `@import url('${base}/css?family=${family}:wght@${weights}');

body {
  font-family: '${family}', sans-serif;
}`,
        html: `<link rel="stylesheet" href="${base}/css?family=${family}:wght@${weights}">`,
        url: `${base}/css?family=${family}:wght@${weights}`
      };
      
      const codeEl = document.querySelector('#fontModalCode code');
      codeEl.className = fontCodeTab === 'css' ? 'language-css' : 'language-markup';
      codeEl.textContent = codes[fontCodeTab];
      Prism.highlightElement(codeEl);
    }
    
    // ========================================
    // ICON MODAL
    // ========================================
    function openIconModal(icon) {
      currentIcon = icon;
      currentIconVariant = 'regular';
      iconCodeTab = 'html';
      
      const modal = document.getElementById('iconModal');
      document.getElementById('iconModalTitle').textContent = icon.displayName || icon.name;
      
      const baseUrl = API_BASE.replace('/api/v1', '');
      document.getElementById('iconModalPreview').innerHTML = ['thin', 'light', 'regular', 'bold', 'fill', 'duotone'].map(v => {
        const filename = v === 'regular' ? `${icon.name}.svg` : `${icon.name}-${v}.svg`;
        const url = `${baseUrl}/icons/phosphor/svg/${v}/${filename}`;
        const isActive = v === 'regular' ? 'active' : '';
        
        return `
          <div class="icon-variant-preview ${isActive}" data-variant="${v}" onclick="selectIconVariant('${v}')">
            <img src="${url}" alt="${icon.name} ${v}">
            <span>${v}</span>
          </div>
        `;
      }).join('');
      
      updateIconCode();
      updateIconModalFavBtn();
      
      // Reset code tabs
      modal.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
      modal.querySelector('.code-tab').classList.add('active');
      
      modal.classList.add('open');
    }
    
    function selectIconVariant(variant) {
      currentIconVariant = variant;
      
      const container = document.getElementById('iconModalPreview');
      container.querySelectorAll('.icon-variant-preview').forEach(el => {
        el.classList.toggle('active', el.dataset.variant === variant);
      });
      
      updateIconCode();
    }
    
    function closeIconModal() {
      document.getElementById('iconModal').classList.remove('open');
    }
    
    function updateIconModalFavBtn() {
      if (!currentIcon) return;
      const btn = document.getElementById('iconModalFavBtn');
      const isFav = isIconFavorite(currentIcon.name);
      btn.innerHTML = `<i class="ph ${isFav ? 'ph-heart-fill' : 'ph-heart'}"></i>`;
      btn.classList.toggle('active', isFav);
    }
    
    document.getElementById('iconModalFavBtn').onclick = () => {
      if (currentIcon) {
        toggleIconFavorite(currentIcon.name);
      }
    };
    
    function updateIconCode() {
      if (!currentIcon) return;
      const name = currentIcon.name;
      const pascal = (currentIcon.displayName || name).split(/[-\s]/).map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('');
      
      const variantSuffix = currentIconVariant === 'regular' ? '' : currentIconVariant.charAt(0).toUpperCase() + currentIconVariant.slice(1);
      const reactComponentName = `${pascal}${variantSuffix}`;
      
      const base = window.location.origin;
      const filename = currentIconVariant === 'regular' ? `${name}.svg` : `${name}-${currentIconVariant}.svg`;
      const svgUrl = `${base}/icons/phosphor/svg/${currentIconVariant}/${filename}`;
      
      const codes = {
        html: currentIconVariant === 'regular' 
          ? `<i class="ph ph-${name}"></i>`
          : `<i class="ph-${currentIconVariant} ph-${name}"></i>`,
        react: `import { ${reactComponentName} } from '@phosphor-icons/react';

<${reactComponentName} size={24} />`,
        svg: svgUrl
      };
      
      const codeEl = document.querySelector('#iconModalCode code');
      codeEl.className = iconCodeTab === 'react' ? 'language-jsx' : 'language-markup';
      codeEl.textContent = codes[iconCodeTab];
      Prism.highlightElement(codeEl);
    }
    
    // ========================================
    // CODE TABS
    // ========================================
    document.querySelectorAll('.code-block').forEach(block => {
      block.querySelectorAll('.code-tab').forEach(tab => {
        tab.onclick = () => {
          block.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          
          if (block.closest('#fontModal')) {
            fontCodeTab = tab.dataset.code;
            updateFontCode();
          } else {
            iconCodeTab = tab.dataset.code;
            updateIconCode();
          }
        };
      });
    });
    
    // ========================================
    // COPY
    // ========================================
    function copyCode(btn) {
      const pre = btn.parentElement.querySelector('pre');
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code.textContent).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
    
    // ========================================
    // PREVIEW INPUT
    // ========================================
    document.getElementById('fontPreviewInput').oninput = (e) => {
      document.getElementById('fontModalPreview').textContent = e.target.value || 'The quick brown fox jumps over the lazy dog';
    };
    
    // ========================================
    // MODAL CLOSE
    // ========================================
    document.querySelectorAll('.modal-backdrop').forEach(modal => {
      modal.onclick = (e) => {
        if (e.target === modal) modal.classList.remove('open');
      };
    });
    
    document.onkeydown = (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
      }
    };
    
    // ========================================
    // FONT INJECTION
    // ========================================
    function injectFont(font) {
      if (!font.files?.regular) return;
      const family = font.family;
      if (document.getElementById(`font-${family}`)) return;
      
      const url = font.files.regular.woff2 || font.files.regular.woff || font.files.regular.ttf;
      if (!url) return;
      
      const style = document.createElement('style');
      style.id = `font-${family}`;
      style.textContent = `@font-face { font-family: '${family}'; src: url('${url}'); font-display: swap; }`;
      document.head.appendChild(style);
    }
    
    // ========================================
    // MOCK DATA
    // ========================================
    function getMockFonts() {
      return [
        { family: 'Aeonik', displayName: 'Aeonik', category: 'sans-serif', variants: ['100', '300', '400', '500', '700', '900'] },
        { family: 'Adren', displayName: 'Adren', category: 'sans-serif', variants: ['400', '700'] },
        { family: 'Aboca', displayName: 'Aboca', category: 'serif', variants: ['400', '700'] },
        { family: 'Berkeley Mono', displayName: 'Berkeley Mono', category: 'monospace', variants: ['400', '500', '600', '700'] },
        { family: 'Canela', displayName: 'Canela', category: 'serif', variants: ['300', '400', '500', '700'] },
        { family: 'Editorial New', displayName: 'Editorial New', category: 'display', variants: ['300', '400', '700'] }
      ];
    }
    
    function getMockIcons() {
      return [
        { name: 'acorn', displayName: 'Acorn', tags: ['acorn', 'nature', 'tree'] },
        { name: 'address-book', displayName: 'Address Book', tags: ['address', 'book', 'contact'] },
        { name: 'alarm', displayName: 'Alarm', tags: ['alarm', 'clock', 'time'] },
        { name: 'airplane', displayName: 'Airplane', tags: ['airplane', 'travel', 'flight'] },
        { name: 'archive', displayName: 'Archive', tags: ['archive', 'storage', 'box'] },
        { name: 'arrow-right', displayName: 'Arrow Right', tags: ['arrow', 'direction', 'right'] },
        { name: 'bell', displayName: 'Bell', tags: ['bell', 'notification', 'alert'] },
        { name: 'book', displayName: 'Book', tags: ['book', 'read', 'library'] },
        { name: 'calendar', displayName: 'Calendar', tags: ['calendar', 'date', 'schedule'] },
        { name: 'camera', displayName: 'Camera', tags: ['camera', 'photo', 'picture'] },
        { name: 'chat', displayName: 'Chat', tags: ['chat', 'message', 'conversation'] },
        { name: 'check', displayName: 'Check', tags: ['check', 'done', 'complete'] }
      ];
    }
    
    // ========================================
    // INIT
    // ========================================
    loadFavorites();
    loadFonts();
    loadIcons();
  </script>
</body>
</html>
